<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 40px;
        }

        .container{
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
            color: navy;
            font-size: 38px;
        }

        h2{
            margin-top: 35px;
            margin-bottom: 18px;
            color: navy;
            border-left: 6px solid navy;
            padding-left: 12px;
            font-size: 24px;
        }

        .assignment-list a{
            display: block;
            text-decoration: none;
            background: #f8fafc;
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 10px;
            color: #1e293b;
            font-weight: bold;
            border: 1px solid #dbe4f0;
            transition: all 0.3s ease;
        }

        .assignment-list a:hover{
            background: navy;
            color: white;
            transform: translateX(6px);
        }

        @media (max-width: 600px){
            body{
                padding: 20px;
            }

            .container{
                padding: 25px;
            }

            h1{
                font-size: 30px;
            }

            h2{
                font-size: 20px;
            }
        }
    </style>
</head>
