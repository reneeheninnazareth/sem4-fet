<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <ul>
      <li> FRONTEND  DEVELOPMENT</li>
      <ol>
        <li id="f1">HTML5</li>
        <li id= "f2 ">CSS3</li>
        <li id="f3">Javascript</li>
      </ol>
      <li>STYLING &FRAMEWORK</li>
      <ol>
        <li id="s1">BOOTSTRAP</li>
        <li id="s2>TAILWIND CSS</li>
      </ol>
      <li> TOOLS & PLATFORMS</li>
      <ol>
        <li id="t1">GIT</li>
        <li id="t2">GITHUB</li>
      <li id="t3">VS CODE</li>
      </ol>
    </ul>
    <button onclick="changeSkill()">CLICK ME TO CHANGE ROLE</buttton>
  </body>
  
    
  <script>
function changeSkill(){

  let c = prompt("Select Category:\n1-Frontend\n2-Styling\n3-Tools");
  let i = prompt("Select Skill Number");

  let id = "";

  if(c == 1){
    if(i == 1) id = "f1";
    else if(i == 2) id = "f2";
    else if(i == 3) id = "f3";
  }
  else if(c == 2){
    if(i == 1) id = "s1";
    else if(i == 2) id = "s2";
  }
  else if(c == 3){
    if(i == 1) id = "t1";
    else if(i == 2) id = "t2";
    else if(i==3)id="t3";
  }

  if(id != ""){
    let newSkill = prompt("Enter new skill");
    document.getElementById(id).innerHTML = newSkill;
    alert("Updated!");
  } else {
    alert("Invalid choice");
  }


}
</script>

</html>
