<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Password System</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:20px;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#2563eb,#60a5fa);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:100%;
            max-width:450px;
            background:white;
            padding:30px;
            border-radius:18px;
            box-shadow:0 6px 18px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:14px;
            border:2px solid #93c5fd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }

        input:focus{
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:18px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#eff6ff;
            border-radius:10px;
            text-align:center;
            font-size:16px;
            word-wrap:break-word;
        }

        @media(max-width:600px){

            .container{
                padding:20px;
            }

            h2{
                font-size:24px;
            }

            input{
                font-size:15px;
                padding:12px;
            }

            button{
                font-size:15px;
                padding:12px;
            }

            #result{
                font-size:15px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Create and Verify Password</h2>

    <label>Create Password</label>

    <input type="password"
    id="createPassword"
    placeholder="Enter New Password">

    <button onclick="savePassword()">
        Save Password
    </button>

    <label>Enter Password</label>

    <input type="password"
    id="checkPassword"
    placeholder="Enter Password to Login">

    <button onclick="checkPassword()">
        Login
    </button>

    <div id="result">
        Create your password first
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
