<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Password System</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#2563eb,#60a5fa);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:90%;
            max-width:420px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            color:#1e3a8a;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:2px solid #93c5fd;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#eff6ff;
            border-radius:8px;
            font-size:16px;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Create and Verify Password</h2>

    <input type="password"
    id="createPassword"
    placeholder="Create Password">

    <button onclick="savePassword()">
        Save Password
    </button>

    <input type="password"
    id="checkPassword"
    placeholder="Enter Password to Login">

    <button onclick="checkPassword()">
        Login
    </button>

    <div id="result">
        Create your password first
    </div>

</div>

<!-- External JavaScript File -->
<script src="script.js"></script>

</body>
</html>
