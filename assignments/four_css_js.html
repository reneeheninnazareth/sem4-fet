<!DOCTYPE html>
<html>
<head>
<style>

  body{
    margin:0;
    height:45vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    
  }

  .buttons{
    display:flex;
    gap:10px;
  }

  .container {
    position: relative;
    width: 200px;
    height: 200px;
  }

  .box {
    width: 200px;
    height: 200px;
    position: absolute;
    border: 2px solid black;
    border-radius: 10px;
    transition: all 0.3s ease;
    z-index: 1;
  }

  #red { background-color: #ff4d4d; }
  #blue { background-color: #4d94ff; }
  #green { background-color: #4CAF50; }

  button {
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
  }

</style>
</head>
<body>

<h2>Layer Controller</h2>

<div class="buttons">
  <button onclick="bringToFront('red')">Red to Front</button>
  <button onclick="bringToFront('blue')">Blue to Front</button>
  <button onclick="bringToFront('green')">Green to Front</button>
</div>

<div class="container">
  <div id="red" class="box"></div>
  <div id="blue" class="box"></div>
  <div id="green" class="box"></div>
</div>

<script>

let topLayer = 10;

function bringToFront(id) {
  const targetBox = document.getElementById(id);
  topLayer++;
  targetBox.style.zIndex = topLayer;
}

</script>

</body>
</html>
