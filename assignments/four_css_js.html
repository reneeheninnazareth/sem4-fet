<!DOCTYPE html>
<html>
<head>
    <title>Pull Down Menu and List Box</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            margin-top:50px;
        }

        .container{
            background:white;
            width:350px;
            margin:auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        select{
            width:200px;
            padding:8px;
            margin:15px;
            font-size:16px;
        }

        h2{
            color:#333;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            color:blue;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Pull-Down Menu</h2>

    <select id="course">
        <option value="">Select Course</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
    </select>

    <h2>List Box</h2>

    <select id="city" size="4">
        <option>Mysore</option>
        <option>Bangalore</option>
        <option>Mangalore</option>
        <option>Hubli</option>
    </select>

    <div id="result"></div>

</div>

<script>

    
    document.getElementById("course").addEventListener("change", function() {

        document.getElementById("result").innerHTML =
        "Selected Course: " + this.value;

    });

    
    document.getElementById("city").onchange = function() {

        document.getElementById("result").innerHTML =
        "Selected City: " + this.value;

    };

</script>

</body>
</html>
