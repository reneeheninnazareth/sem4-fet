<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Opportunity Form</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .container{
        background:white;
        padding:25px;
        width:100%;
        max-width:400px;
        border-radius:12px;
        box-shadow:0 0 15px rgba(0,0,0,0.15);
    }

    h1{
        text-align:center;
        color:#1e3a8a;
        margin-bottom:20px;
    }

    label{
        font-weight:bold;
        color:#333;
    }

    input, select{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:6px;
        margin-bottom:15px;
        font-size:15px;
    }

    .inline{
        width:auto;
        margin-right:5px;
    }

    .btn{
        width:100%;
        background:#1e3a8a;
        color:white;
        border:none;
        padding:12px;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
        font-weight:bold;
        transition:0.3s;
    }

    .btn:hover{
        background:#172554;
    }

    #result{
        margin-top:20px;
        background:#eef2ff;
        padding:15px;
        border-radius:8px;
        display:none;
        line-height:1.8;
    }

    .assignment-btn{
        display:block;
        text-align:center;
        text-decoration:none;
        background:#2563eb;
        color:white;
        padding:12px;
        border-radius:8px;
        margin-top:18px;
        font-weight:bold;
        transition:0.3s;
    }

    .assignment-btn:hover{
        background:#1d4ed8;
    }

</style>
</head>

<body>

<div class="container">

<h1>JOB OPPORTUNITY</h1>

<form onsubmit="showdata(event)">

<label>Name</label>
<input type="text" id="name" placeholder="Enter Name" required>

<label>Education</label>
<select id="edu">
    <option>CSE</option>
    <option>AIML</option>
    <option>IT</option>
    <option>ECE</option>
</select>

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>

<label>Gender:</label><br>

<input type="radio" class="inline" name="gender" value="Male"> Male
<input type="radio" class="inline" name="gender" value="Female"> Female

<br><br>

<label>Programming Language:</label><br>

<input type="checkbox" class="lng inline" value="Python"> Python
<input type="checkbox" class="lng inline" value="C"> C
<input type="checkbox" class="lng inline" value="C++"> C++

<br><br>

<label>Availability:</label><br>

<input type="radio" class="inline" name="availability" value="Full Time"> Full Time
<input type="radio" class="inline" name="availability" value="Part Time"> Part Time

<br><br>

<label>Languages Known:</label><br>

<select id="languages" multiple size="4">
    <option>English</option>
    <option>Hindi</option>
    <option>Kannada</option>
    <option>Tamil</option>
</select>

<input type="submit" value="Submit" class="btn">

</form>

<div id="result"></div>



<a href="https://reneeheninnazareth.github.io/sem4-fet/"
   target="_blank"
   class="assignment-btn">
   Assignment Section
</a>

</div>

<script>

function showdata(e){

    e.preventDefault();

    let name = document.getElementById("name").value;
    let edu = document.getElementById("edu").value;
    let email = document.getElementById("email").value;

    let gender = document.querySelector('input[name="gender"]:checked');
    gender = gender ? gender.value : "Not Selected";

    let availability = document.querySelector('input[name="availability"]:checked');
    availability = availability ? availability.value : "Not Selected";

    let lng = document.querySelectorAll(".lng:checked");

    let list = [];

    lng.forEach(item => {
        list.push(item.value);
    });

    let languages = document.getElementById("languages");
    let selectedLanguages = [];

    for(let option of languages.options){
        if(option.selected){
            selectedLanguages.push(option.value);
        }
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML =
        "<h3>Submitted Details</h3>" +
        "Name: " + name + "<br>" +
        "Education: " + edu + "<br>" +
        "Email: " + email + "<br>" +
        "Gender: " + gender + "<br>" +
        "Programming Languages: " + list.join(", ") + "<br>" +
        "Availability: " + availability + "<br>" +
        "Languages Known: " + selectedLanguages.join(", ");
}

</script>

</body>
</html>
